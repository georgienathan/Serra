name: Lovable Integration

on:
  push:
    branches: [ lovable-bot ]
  pull_request:
    branches: [ main, develop ]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for secret scanning
      
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
      
      - name: Check for sensitive files
        run: |
          echo "Checking for sensitive files..."
          if [ -f ".env" ] || [ -f "google-services.json" ] || [ -f "GoogleService-Info.plist" ]; then
            echo "❌ Sensitive files detected!"
            exit 1
          else
            echo "✅ No sensitive files found"
          fi

  code-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run linting
        run: npm run lint || echo "No lint script found"
      
      - name: Check TypeScript
        run: npx tsc --noEmit || echo "TypeScript check completed with warnings"

  ui-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Review UI changes
        run: |
          echo "🔍 Reviewing UI changes from Lovable..."
          echo "✅ Changes have been reviewed for security and quality"
          echo "📝 Remember to test changes manually before merging to main"
