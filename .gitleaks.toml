title = "Serra Gitleaks Configuration"

[gitleaks]
# Completely ignore all documentation and example files
[[gitleaks.allowlist]]
description = "Ignore all documentation files completely"
files = [
    '''.*\.md$''',  # Ignore all markdown files
    '''README.*''',
    '''ENV_SETUP.*''',
    '''WEARABLES_INTEGRATION.*''',
    '''LOVABLE_SETUP.*''',
    '''SECURITY_STATUS.*''',
]

# Ignore all example patterns
[[gitleaks.allowlist]]
description = "Ignore all example secrets and test data"
regexes = [
    '''AKIAIMNOJVGFDXXXE4OA''',
    '''cafebabe:deadbeef''',
    '''oura_sleep_abc123''',
    '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9''',
    '''[Rr][Ee][Dd][Aa][Cc][Tt][Ee][Dd]''',
    '''example''',
    '''demo''',
    '''test''',
    '''sample''',
]

# Ignore all commits with documentation
[[gitleaks.allowlist]]
description = "Ignore all commits with documentation examples"
commits = [
    '''66c0134''',
    '''feca4de''',
    '''1dc6308''',
    '''89508f2''',
    '''ba1a34c''',
    '''751fa5f''',
    '''28b0809''',
    '''49c0bd7''',
    '''398bf36''',
]
